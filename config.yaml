server:
  host: "0.0.0.0"
  port: 8000

rate_limit:
  # 每平台两次请求的最小间隔（毫秒）。Web 逆向通道高频调用会触发上游风控
  # （限流返回空，甚至「账号已被禁言至 …」），默认 3 秒；0 = 关闭控频（风险自负）。
  # 也可用环境变量 RATE_LIMIT_MS 覆盖。
  min_interval_ms: 3000
  # 按平台覆盖（毫秒）。DeepSeek 于 2026-09-11 实测触发风控（账号禁言至次日 11:02），
  # 解封后先用 10 秒间隔观察，无异常再调回 3000：
  overrides:
    deepseek: 10000

providers:
  deepseek:
    base_url: "https://chat.deepseek.com"
    enabled: true
  kimi:
    base_url: "https://kimi.moonshot.cn"
    enabled: true
  metaso:
    base_url: "https://metaso.cn"
    enabled: true
  doubao:
    base_url: "https://www.doubao.com"
    enabled: true
  qwen:
    base_url: "https://qianwen.biz.aliyun.com/dialog"
    enabled: true
  zhipu:
    base_url: "https://chatglm.cn"
    enabled: true
  minimax:
    base_url: "https://agent.minimaxi.com"
    enabled: true
